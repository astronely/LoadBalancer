volumes:
  redis-data:

networks:
  load_balancer:

services:
  redis:
    image: redis:7.4.2-alpine3.21
    env_file:
      - "./prod.env"
    command: /bin/sh -c "redis-server"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - load_balancer

  backend-1:
    build:
      context: ./BackendServer
    command: ["./main", "-port=9000"]
    ports:
      - "9000:9000"
    networks:
      - load_balancer
    platform: linux/amd64

  backend-2:
    build:
      context: ./BackendServer
    command: ["./main", "-port=9001"]
    ports:
      - "9001:9000"
    networks:
      - load_balancer
    platform: linux/amd64

  backend-3:
    build:
      context: ./BackendServer
    command: ["./main", "-port=9002"]
    ports:
      - "9002:9000"
    networks:
      - load_balancer
    platform: linux/amd64

  load_balancer:
    build:
      context: ./loadBalancer
    ports:
      - "8080:8080"
    networks:
      - load_balancer
    platform: linux/amd64
    depends_on:
      - redis